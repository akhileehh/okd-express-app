version: "3.8"

services:
  app1:
    build: .
    container_name: app1
    expose:
      - "3000"
    networks:
      - app-network
    environment:
      - NODE_ENV=production

  app2:
    build: ./app2
    container_name: app2
    expose:
      - "3002"
    networks:
      - app-network
    environment:
      - NODE_ENV=production

  nginx:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    depends_on:
      - app1
      - app2
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  app-network:
    driver: bridge
