apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1
  labels:
    app: app1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
        - name: app1
          # Replace this image with your registry/image (built from ./)
          image: REPLACE_WITH_REGISTRY/app1:latest
          ports:
            - containerPort: 3000
