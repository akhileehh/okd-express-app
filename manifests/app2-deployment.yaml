apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  labels:
    app: app2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
        - name: app2
          # Replace this image with your registry/image (built from ./app2)
          image: REPLACE_WITH_REGISTRY/app2:latest
          ports:
            - containerPort: 3002
