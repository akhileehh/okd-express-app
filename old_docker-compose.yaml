version: "3.8"

services:
  app1:
    build: .
    container_name: app1
    expose:
      - "3000"

  app2:
    build: ./app2
    container_name: app2
    expose:
      - "3002"
  

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
